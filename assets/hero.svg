<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Yadav Raj, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".5" stop-color="#172554"/><stop offset=".82" stop-color="#2e1065"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="floor"><rect x="0" y="200" width="1000" height="120"/></clipPath>
<clipPath id="card"><rect width="1000" height="320" rx="22"/></clipPath>
</defs>
<style>
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
.scroll{animation:scroll 1.6s linear infinite}
@keyframes scroll{from{transform:translateY(0)}to{transform:translateY(20px)}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:800px 215px}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.8;transform:scale(1.15)}}
</style>
<g clip-path="url(#card)">
<rect width="1000" height="320" fill="url(#bg)"/>
<circle class="tw" cx="60" cy="40" r="1.5" fill="#e0f2fe" style="animation-delay:0s"/><circle class="tw" cx="190" cy="70" r="1" fill="#e0f2fe" style="animation-delay:1s"/><circle class="tw" cx="330" cy="30" r="1.5" fill="#e0f2fe" style="animation-delay:2s"/><circle class="tw" cx="470" cy="60" r="1" fill="#e0f2fe" style="animation-delay:0.5s"/><circle class="tw" cx="610" cy="28" r="1.5" fill="#e0f2fe" style="animation-delay:1.5s"/><circle class="tw" cx="700" cy="80" r="1" fill="#e0f2fe" style="animation-delay:2.5s"/><circle class="tw" cx="930" cy="45" r="1.5" fill="#e0f2fe" style="animation-delay:0.8s"/><circle class="tw" cx="960" cy="200" r="1" fill="#e0f2fe" style="animation-delay:1.8s"/><circle class="tw" cx="880" cy="260" r="1.5" fill="#e0f2fe" style="animation-delay:0.3s"/><circle class="tw" cx="40" cy="250" r="1" fill="#e0f2fe" style="animation-delay:2.2s"/><circle class="tw" cx="420" cy="280" r="1" fill="#e0f2fe" style="animation-delay:1.2s"/>
<g clip-path="url(#floor)" stroke="#22d3ee" stroke-opacity=".28" stroke-width="1"><line x1="500" y1="200" x2="-500" y2="320"/><line x1="500" y1="200" x2="-400" y2="320"/><line x1="500" y1="200" x2="-300" y2="320"/><line x1="500" y1="200" x2="-200" y2="320"/><line x1="500" y1="200" x2="-100" y2="320"/><line x1="500" y1="200" x2="0" y2="320"/><line x1="500" y1="200" x2="100" y2="320"/><line x1="500" y1="200" x2="200" y2="320"/><line x1="500" y1="200" x2="300" y2="320"/><line x1="500" y1="200" x2="400" y2="320"/><line x1="500" y1="200" x2="500" y2="320"/><line x1="500" y1="200" x2="600" y2="320"/><line x1="500" y1="200" x2="700" y2="320"/><line x1="500" y1="200" x2="800" y2="320"/><line x1="500" y1="200" x2="900" y2="320"/><line x1="500" y1="200" x2="1000" y2="320"/><line x1="500" y1="200" x2="1100" y2="320"/><line x1="500" y1="200" x2="1200" y2="320"/><line x1="500" y1="200" x2="1300" y2="320"/><line x1="500" y1="200" x2="1400" y2="320"/><line x1="500" y1="200" x2="1500" y2="320"/><g class="scroll"><line x1="0" y1="180" x2="1000" y2="180"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="220" x2="1000" y2="220"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="260" x2="1000" y2="260"/><line x1="0" y1="280" x2="1000" y2="280"/><line x1="0" y1="300" x2="1000" y2="300"/><line x1="0" y1="320" x2="1000" y2="320"/><line x1="0" y1="340" x2="1000" y2="340"/></g></g>
<rect y="200" width="1000" height="120" fill="url(#bg)" opacity="0"/>
<ellipse class="pulse" cx="800" cy="215" rx="90" ry="14" fill="#06b6d4" opacity=".4" filter="url(#glow)"/>

<text x="60" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="74" font-weight="800" fill="url(#tx)" filter="url(#glow)" letter-spacing="2">YADAV RAJ</text>
<text x="64" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#67e8f9" letter-spacing="7">FULL STACK DEVELOPER</text>
<text x="64" y="228" font-family="JetBrains Mono,Consolas,monospace" font-size="15" fill="#94a3b8">&gt; React / Node.js / MongoDB / Java / Python / Django</text>
<rect class="bl" x="64" y="244" width="10" height="18" fill="#38bdf8"/>

<g transform="translate(800 150) rotate(-18)" fill="none">
<ellipse rx="145" ry="44" stroke="#06b6d4" stroke-opacity=".55" stroke-dasharray="3 7"/>
<circle r="7" fill="#67e8f9" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M-145,0 A145,44 0 1,1 145,0 A145,44 0 1,1 -145,0"/></circle>
<circle r="4" fill="#fff"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M-145,0 A145,44 0 1,1 145,0 A145,44 0 1,1 -145,0"/></circle>
</g>
<g transform="translate(800 150) rotate(28)" fill="none">
<ellipse rx="118" ry="32" stroke="#a78bfa" stroke-opacity=".6" stroke-dasharray="3 7"/>
<circle r="6" fill="#c4b5fd" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" path="M-118,0 A118,32 0 1,0 118,0 A118,32 0 1,0 -118,0"/></circle>
</g>
<g transform="translate(800 150)"><g class="float">
<polygon points="0,-62 52,-32 0,-2 -52,-32" fill="#67e8f9"/>
<polygon points="-52,-32 0,-2 0,58 -52,28" fill="#0891b2"/>
<polygon points="0,-2 52,-32 52,28 0,58" fill="#6d28d9"/>
<g stroke="#fff" stroke-opacity=".55" stroke-width="1.5" fill="none"><polyline points="-52,-32 0,-2 52,-32"/><line x1="0" y1="-2" x2="0" y2="58"/></g>
<text x="-34" y="26" font-family="JetBrains Mono,Consolas,monospace" font-size="15" font-weight="700" fill="#ecfeff" transform="skewY(30) translate(0 -25)">&lt;/&gt;</text>
</g></g>
<g transform="translate(800 150) rotate(-18) translate(0 0)"></g>
<rect x="1" y="1" width="998" height="318" rx="21" fill="none" stroke="#38bdf8" stroke-opacity=".35"/>
</g>
</svg>
